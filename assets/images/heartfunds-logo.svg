<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 390" role="img" aria-labelledby="title desc">
  <title id="title">Heartfunds</title>
  <desc id="desc">Heartfunds logo with a stylized H flame mark and the tagline Ideas, Solutions, Real Impact.</desc>
  <defs>
    <linearGradient id="brand" x1="0%" y1="15%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#a90045"/>
      <stop offset="30%" stop-color="#ef0754"/>
      <stop offset="68%" stop-color="#ff3c3d"/>
      <stop offset="100%" stop-color="#ff8a18"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd36b"/>
      <stop offset="35%" stop-color="#ff7b22"/>
      <stop offset="72%" stop-color="#ff294e"/>
      <stop offset="100%" stop-color="#d9004e"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#17111f"/>
      <stop offset="46%" stop-color="#17111f"/>
      <stop offset="53%" stop-color="#f10b57"/>
      <stop offset="78%" stop-color="#ff3b3e"/>
      <stop offset="100%" stop-color="#ff7c19"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Mark -->
  <g transform="translate(35 28)">
    <path d="M25 70 Q25 35 61 24 L128 4 Q147 -2 147 18 L147 115 Q147 130 135 139 L88 173 L88 334 Q88 351 71 344 L25 323 Q10 316 10 299 Z" fill="url(#brand)"/>
    <path d="M147 106 Q147 91 162 82 L239 39 Q258 29 258 51 L258 291 Q258 308 243 317 L191 345 Q176 354 176 334 L176 168 Z" fill="url(#brand)" transform="translate(0 0)"/>
    <path d="M22 86 C68 134 111 148 159 159 C193 167 217 177 244 199 L244 256 C211 226 184 211 151 203 C98 190 57 175 22 137 Z" fill="url(#ribbon)"/>
    <path d="M22 86 C68 134 111 148 159 159 C193 167 217 177 244 199 L244 218 C212 194 186 182 151 174 C96 161 56 145 22 112 Z" fill="#ffd86e" opacity=".78"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="800" letter-spacing="-5">
    <text x="405" y="222" font-size="154" fill="url(#wordmark)">Heartfunds</text>
  </g>
  <text x="1270" y="105" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#17111f">TM</text>

  <!-- Tagline -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="500" letter-spacing="12" fill="#241b27">
    <text x="407" y="293">IDEAS</text>
    <circle cx="540" cy="284" r="6" fill="#f20b58"/>
    <text x="580" y="293">SOLUTIONS</text>
    <circle cx="795" cy="284" r="6" fill="#ff691f"/>
    <text x="835" y="293">REAL</text>
    <text x="970" y="293">IMPACT</text>
  </g>
</svg>
